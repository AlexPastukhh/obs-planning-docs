name: Materialize exact detailed planning README blob
on:
  push:
    branches:
      - 'tmp/checkpoint-118-rebuild'
    paths:
      - '.github/workflows/build-ap-principles-target.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact target patch and verify
        shell: bash
        run: |
          set -euo pipefail
          git apply .tmp/detailed-readme.patch
          echo '5f04530f2fb8736f5dc2bf12ade576ead0d4b6b7122afb53d1d8ddcf1be0141e  planning/documentation/application-planning/detailed-planning/README.md' | sha256sum -c -
          test "$(git hash-object planning/documentation/application-planning/detailed-planning/README.md)" = 'e76800d4fd95619d6e06580d3a894ff56d1d0c31'
          git config user.name 'OpenAI Migration Builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add planning/documentation/application-planning/detailed-planning/README.md
          git rm -f .tmp/detailed-readme.patch .github/workflows/build-ap-principles-target.yml
          git commit -m 'Materialize exact detailed planning README target blob'
          git push origin HEAD:tmp/checkpoint-118-rebuild
