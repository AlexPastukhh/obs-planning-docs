name: Materialize exact target patch
on:
  push:
    branches:
      - 'tmp/checkpoint-118-rebuild'
    paths:
      - '.tmp/job.env'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact target patch and verify
        shell: bash
        run: |
          set -euo pipefail
          source .tmp/job.env
          test "$(git hash-object "$TARGET_PATH")" = "$BASE_GIT_SHA"
          git apply .tmp/job.patch
          echo "$TARGET_SHA256  $TARGET_PATH" | sha256sum -c -
          test "$(git hash-object "$TARGET_PATH")" = "$TARGET_GIT_SHA"
          git config user.name 'OpenAI Migration Builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET_PATH"
          git rm -f .tmp/job.patch .tmp/job.env
          git commit -m "Materialize exact target blob: $TARGET_PATH"
          git push origin HEAD:tmp/checkpoint-118-rebuild
