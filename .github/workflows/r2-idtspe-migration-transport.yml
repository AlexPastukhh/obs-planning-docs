name: R2 IDTSPE migration transport
on:
  push:
    branches:
      - 'tmp/rpkg-methodology-r2-20260908'
    paths:
      - '.migration-xz/READY'
permissions:
  contents: write
jobs:
  realize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode exact target payload
        shell: bash
        run: |
          set -euo pipefail
          cat .migration-xz/part-*.txt > /tmp/r2-payload.b64
          base64 -d /tmp/r2-payload.b64 > /tmp/r2-payload.tar.xz
          echo 'b0647e973ecebc55e2f478d72e21685397f643b5f92dd6a78af415bf4685272e  /tmp/r2-payload.tar.xz' | sha256sum -c -
          tar -xJf /tmp/r2-payload.tar.xz -C .
          sha256sum -c .migration-verify/remaining.sha256
      - name: Commit exact clean target tree to transport branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .migration-payload .migration-xz .migration-verify .github/workflows/r2-idtspe-migration-transport.yml
          git config user.name 'OpenAI Migration Transport'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git commit -m 'Build exact R2 to IDTSPE/SDS migration target tree'
          git push origin HEAD:tmp/rpkg-methodology-r2-20260908
