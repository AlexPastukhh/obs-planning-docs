name: SonarQube

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'planning/documentation/tools/replacement-package-app/**'
      - 'planning/documentation/tools/replacement-package-builder/**'
      - 'planning/documentation/tools/replacement-package-common/**'
      - 'sonar-project.properties'
      - '.github/workflows/sonarqube.yml'
  pull_request:
    paths:
      - 'planning/documentation/tools/replacement-package-app/**'
      - 'planning/documentation/tools/replacement-package-builder/**'
      - 'planning/documentation/tools/replacement-package-common/**'
      - 'sonar-project.properties'
      - '.github/workflows/sonarqube.yml'

jobs:
  sonarqube:
    name: SonarQube
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and test replacement-package-app
        working-directory: planning/documentation/tools/replacement-package-app
        run: cmd /c run-tests.cmd

      - name: Build and test replacement-package-builder
        working-directory: planning/documentation/tools/replacement-package-builder
        run: cmd /c run-tests.cmd

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
