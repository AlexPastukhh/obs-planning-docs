sonar.projectKey=AlexPastukhh_obs-planning-docs
sonar.organization=alexpastukhh
sonar.projectName=obs-planning-docs
sonar.sourceEncoding=UTF-8

# Analyze only the two replacement-package Java tools.
sonar.sources=planning/documentation/tools/replacement-package-app/src/main/java,planning/documentation/tools/replacement-package-builder/src/main/java
sonar.tests=planning/documentation/tools/replacement-package-app/src/test/java,planning/documentation/tools/replacement-package-builder/src/test/java

# These projects are built without Maven/Gradle, so Sonar needs the compiled bytecode explicitly.
sonar.java.binaries=planning/documentation/tools/replacement-package-app/build/classes,planning/documentation/tools/replacement-package-builder/build/classes
sonar.java.test.binaries=planning/documentation/tools/replacement-package-app/build/test-classes,planning/documentation/tools/replacement-package-builder/build/test-classes
